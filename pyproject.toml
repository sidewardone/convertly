[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "convertly"
dynamic = ["version"]
description = "Desktop converter for video, audio and images, powered by ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ffmpeg", "converter", "video", "audio", "images", "qt", "pyside6", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
convertly = "convertly.__main__:main"

[tool.hatch.version]
path = "src/convertly/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/convertly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
