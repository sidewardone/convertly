name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Convertly-linux-x64.tar.gz
          - os: windows-latest
            artifact: Convertly-windows-x64.zip

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Подготовить ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p vendor
          cp "$(command -v ffmpeg)" vendor/ffmpeg
          cp "$(command -v ffprobe)" vendor/ffprobe
          if [ -f /usr/share/doc/ffmpeg/copyright ]; then
            cp /usr/share/doc/ffmpeg/copyright vendor/FFMPEG-LICENSE.txt
          fi

      - name: Подготовить ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force vendor | Out-Null
          $ffmpeg = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName vendor\ffmpeg.exe
          Copy-Item $ffprobe.FullName vendor\ffprobe.exe
          $license = Get-ChildItem ffmpeg -Recurse -Include LICENSE,LICENSE.txt,COPYING* | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName vendor\FFMPEG-LICENSE.txt }

      - name: Добавить ffmpeg в PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${{ github.workspace }}\vendor" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Установить зависимости
        run: pip install ".[dev]" pyinstaller

      - name: Тесты
        run: pytest

      - name: Сборка (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller packaging/convertly.spec --noconfirm
          tar -czf Convertly-linux-x64.tar.gz -C dist Convertly

      - name: Сборка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller packaging/convertly.spec --noconfirm
          Compress-Archive -Path dist\Convertly\* -DestinationPath Convertly-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
